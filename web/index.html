<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Suno Song Studio</title>
<style>
  :root{
    --bg:#0d0814; --panel:#150d1f; --card:#1a1226; --line:#3a2a4a;
    --accent:#a06bf0; --accent2:#7e4fd4; --text:#e8e0f0; --dim:#9a8ab0;
    --green:#6FCF97; --red:#c0736a;
    --mono:'SF Mono',Menlo,monospace; --sans:-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:0 0 80px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  header{background:linear-gradient(135deg,#1a1226,#241433);border-bottom:1px solid var(--accent2);padding:26px 0}
  header h1{font-size:26px;letter-spacing:1px}
  header p{color:var(--dim);font-size:13px;margin-top:6px}
  .status{display:inline-block;font-size:11px;padding:3px 12px;border-radius:12px;background:#2a1a3a;color:var(--dim);margin-top:10px}
  .status.on{background:rgba(111,207,151,.12);color:var(--green)}
  .status.off{background:rgba(192,115,106,.12);color:var(--red)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}
  .panel h2{font-size:15px;letter-spacing:1px;color:#c9a4ff;margin-bottom:14px}

  label{display:block;font-size:11px;letter-spacing:1px;color:var(--dim);margin:12px 0 6px;text-transform:uppercase}
  textarea,input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:var(--sans);font-size:14px;padding:11px 13px;outline:none}
  textarea{resize:vertical;min-height:72px;line-height:1.6}
  textarea:focus,input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}

  .genres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .genre{background:#2a1a3a;color:#b39ddb;border:1px solid transparent;padding:7px 13px;border-radius:8px;
    cursor:pointer;font-size:12px;transition:.15s}
  .genre:hover{border-color:var(--accent)}
  .genre.active{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:600}

  .btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  button.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;
    padding:12px 22px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:14px;letter-spacing:.5px}
  button.ghost{background:#2a1a3a;color:#c9a4ff;border:1px solid var(--accent2);padding:11px 18px;
    border-radius:10px;cursor:pointer;font-size:13px}
  button:disabled{opacity:.5;cursor:wait}
  .toggle{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;cursor:pointer;user-select:none}
  .count{color:var(--dim);font-size:12px;margin-left:auto}

  .song{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
  .song-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .song-h .t{font-size:17px;font-weight:bold;color:#c9a4ff}
  .song-h .g{font-size:11px;color:var(--dim)}
  .field-h{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
  .field-h span{font-size:10px;letter-spacing:2px;color:var(--dim)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:11px;white-space:pre-wrap;
    word-break:break-word;font-size:12px;line-height:1.55;font-family:var(--mono);color:#d8c8e8;margin:0}
  pre.lyr{color:#c8d8e0}
  .cp{background:#2a1a3a;color:#c9a4ff;border:none;border-radius:5px;padding:2px 9px;cursor:pointer;font-size:11px}
  .err{color:#e08080;background:#1a0d0d;border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;margin-top:12px}
  .hint{color:var(--dim);font-size:12px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>🎵 Suno Song Studio</h1>
  <p>Describe a vibe → get a complete song (title + style + lyrics) ready to paste into Suno. Generate one, or a whole playlist.</p>
  <span class="status" id="status">checking backend…</span>
</div></header>

<div class="wrap">

  <div class="panel">
    <h2>1 · Pick a base genre (optional)</h2>
    <div class="genres" id="genres"></div>
    <p class="hint" id="genreStyle" style="margin-top:8px;font-style:italic"></p>

    <label>2 · What do you want? (mood, scene, story, extra elements)</label>
    <textarea id="idea" placeholder="e.g. late-night R&B with a lonely rainy feel, just after a breakup, catchy chorus — for a study/chill YouTube playlist"></textarea>

    <div class="row" style="margin-top:6px">
      <div>
        <label>Lyrics language</label>
        <select id="lang">
          <option value="english">English</option>
          <option value="korean">Korean (한국어)</option>
          <option value="japanese">Japanese (日本語)</option>
          <option value="mandarin">Mandarin (中文)</option>
          <option value="spanish">Spanish</option>
        </select>
      </div>
      <div>
        <label>Playlist size (batch)</label>
        <input id="count" type="number" min="1" max="20" value="5">
      </div>
    </div>

    <div class="btns">
      <button class="primary" id="genBtn" onclick="genOne()">✨ Generate 1 song</button>
      <button class="ghost" id="batchBtn" onclick="genBatch()">⚡ Generate playlist</button>
      <label class="toggle"><input type="checkbox" id="instr"> Instrumental (no vocals)</label>
      <span class="count" id="count_out">0 songs</span>
    </div>
  </div>

  <div class="panel" id="resultsPanel" style="display:none">
    <h2 style="display:flex;align-items:center">3 · Your songs
      <button class="ghost" style="margin-left:auto" onclick="exportTxt()">⬇️ Export .txt</button>
      <button class="ghost" onclick="exportJson()">⬇️ Export .json</button>
      <button class="ghost" onclick="clearAll()">🗑 Clear</button>
    </h2>
    <div id="results"></div>
  </div>

</div>

<script>
// Served by the bundled backend → same origin. If you open the file directly,
// point this at your local server instead.
const API = location.protocol.startsWith('http') ? '' : 'http://localhost:5001';

const GENRES = {
  midnight_rnb:{label:'🌃 Midnight R&B', style:'smooth r&b, midnight city vibe, soft breathy female vocals, lo-fi drums, warm rhodes piano, deep mellow bass, vinyl crackle, rainy night, 85 bpm, dreamy reverb'},
  groove_pop:{label:'🪩 Groove Pop', style:'groove pop, retro funk, laid-back female vocals, punchy bassline, clean electric guitar, vintage synth, head-nodding groove, 95 bpm, polished'},
  rainy_jazz:{label:'🌧️ Rainy Jazz', style:'jazz lounge, rainy mood, soft female jazz vocals, brushed drums, upright bass, mellow saxophone, warm piano, intimate club, 75 bpm'},
  synthwave:{label:'🌆 Synthwave', style:'chillwave, synthwave, dreamy ethereal female vocals, analog synth pads, retro drum machine, neon night drive, 80s nostalgia, 90 bpm, lush reverb'},
  acoustic:{label:'☀️ Soft Acoustic', style:'indie folk acoustic, gentle female vocals, fingerpicked guitar, soft piano, morning sunlight, organic warm, healing, 80 bpm'},
  lofi:{label:'🎧 Lo-fi Focus', style:'lo-fi hip hop, mellow jazzy chords, dusty drums, warm sub bass, tape saturation, calm focus, 80 bpm'},
  citypop:{label:'🏙️ City Pop', style:'japanese city pop, bright female vocals, funky bass, glossy synths, slap guitar, 80s tokyo nightlife, upbeat, 110 bpm'},
  dreampop:{label:'💗 Dream Pop', style:'dream pop, shoegaze, hazy reverb female vocals, washed-out guitars, lush pads, ethereal, 100 bpm'},
  trap_soul:{label:'🌙 Trap Soul', style:'trap soul, moody male/female vocals, 808 bass, crisp hi-hats, atmospheric keys, late-night, 70 bpm'},
  bossa:{label:'🌴 Bossa Nova', style:'bossa nova, soft brazilian female vocals, nylon guitar, gentle shaker, warm jazz chords, beachside cafe, 90 bpm'},
  epic:{label:'⚔️ Epic Cinematic', style:'epic cinematic, orchestral, soaring choir, powerful strings, big percussion, heroic, trailer music, 120 bpm'},
  edm_chill:{label:'🌊 Chill EDM', style:'melodic chill house, soft female topline, warm plucks, deep bass, festival sunset, smooth drop, 118 bpm'},
};

let ACTIVE = 'midnight_rnb';
let SONGS = [];

function pickGenre(k){
  ACTIVE = k;
  document.querySelectorAll('#genres .genre').forEach(b=>b.classList.toggle('active', b.dataset.k===k));
  document.getElementById('genreStyle').textContent = '↳ base style: ' + GENRES[k].style;
}

function payload(extra){
  return Object.assign({
    idea: document.getElementById('idea').value.trim(),
    base_style: GENRES[ACTIVE].style,
    instrumental: document.getElementById('instr').checked,
    language: document.getElementById('lang').value,
  }, extra||{});
}

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function render(){
  const box = document.getElementById('results');
  box.innerHTML = SONGS.map((s,i)=>{
    const sid='s'+i;
    return `<div class="song">
      <div class="song-h"><span class="t">"${esc(s.title)}"</span><span class="g">${GENRES[ACTIVE].label}</span></div>
      <div class="field-h"><span>STYLE → Suno "Style of Music"</span>
        <button class="cp" onclick="copy('${sid}_s',this)">📋</button></div>
      <pre id="${sid}_s">${esc(s.style)}</pre>
      <div class="field-h"><span>LYRICS → Suno "Lyrics" · Title: ${esc(s.title)}</span>
        <button class="cp" onclick="copy('${sid}_l',this)">📋</button></div>
      <pre id="${sid}_l" class="lyr">${esc(s.lyrics)}</pre>
    </div>`;
  }).join('');
  document.getElementById('resultsPanel').style.display = SONGS.length?'block':'none';
  document.getElementById('count_out').textContent = SONGS.length+' songs';
}

function copy(id,btn){navigator.clipboard.writeText(document.getElementById(id).innerText);
  const o=btn.textContent;btn.textContent='✅';setTimeout(()=>btn.textContent=o,1200);}

function showErr(m){
  document.getElementById('resultsPanel').style.display='block';
  document.getElementById('results').insertAdjacentHTML('afterbegin',
    `<div class="err">❌ ${esc(m)}<br><span class="hint">Backend running? &nbsp;<code>uvicorn server:app --port 5001</code></span></div>`);
}

async function genOne(){
  const idea=document.getElementById('idea').value.trim();
  if(!idea){alert('Describe what you want first.');return;}
  const b=document.getElementById('genBtn');b.disabled=true;b.textContent='⏳ Writing… (~30-60s)';
  try{
    const r=await fetch(API+'/api/suno',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
    if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||r.statusText);}
    SONGS.unshift(await r.json());render();
  }catch(e){showErr(e.message);}finally{b.disabled=false;b.textContent='✨ Generate 1 song';}
}

async function genBatch(){
  const idea=document.getElementById('idea').value.trim();
  if(!idea){alert('Describe what you want first.');return;}
  const n=Math.max(1,Math.min(20,parseInt(document.getElementById('count').value)||5));
  const b=document.getElementById('batchBtn');b.disabled=true;b.textContent=`⏳ Writing ${n}… (this takes a while)`;
  try{
    const r=await fetch(API+'/api/suno/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload({count:n}))});
    if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||r.statusText);}
    const d=await r.json();SONGS=d.songs.concat(SONGS);render();
  }catch(e){showErr(e.message);}finally{b.disabled=false;b.textContent='⚡ Generate playlist';}
}

function clearAll(){SONGS=[];render();}

function exportTxt(){
  const txt=SONGS.map((s,i)=>`### ${i+1}. ${s.title}\n\n[STYLE]\n${s.style}\n\n[LYRICS]\n${s.lyrics}\n`).join('\n'+'='.repeat(50)+'\n\n');
  dl(txt,'songs.txt','text/plain');
}
function exportJson(){dl(JSON.stringify(SONGS,null,2),'songs.json','application/json');}
function dl(content,name,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();
}

async function probe(){
  const s=document.getElementById('status');
  try{
    const r=await fetch(API+'/api/health',{signal:AbortSignal.timeout(2500)});
    if(r.ok){const d=await r.json();s.textContent=`🟢 backend online · ${d.backend} · ${d.model}`;s.className='status on';return;}
  }catch(e){}
  s.textContent='🔴 backend offline — run: uvicorn server:app --port 5001';s.className='status off';
}

// init
(function(){
  const g=document.getElementById('genres');
  Object.keys(GENRES).forEach(k=>{
    const b=document.createElement('div');b.className='genre';b.dataset.k=k;b.textContent=GENRES[k].label;
    b.onclick=()=>pickGenre(k);g.appendChild(b);
  });
  pickGenre('midnight_rnb');
  probe();setInterval(probe,15000);
})();
</script>
</body>
</html>
